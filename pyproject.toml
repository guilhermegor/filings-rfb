[tool.poetry]
name = "filings-rfb"
version = "0.0.0"
description = "Simple and efficient Python library to interact with Secretariat of Federal Revenue of Brazil (Receita Federal Brasileira) public data"
authors = ["guilhermegor"]
readme = "README.md"
license = "MIT"
homepage = "https://guilhermegor.github.io/filings-rfb/"
documentation = "https://guilhermegor.github.io/filings-rfb/"
repository = "https://github.com/guilhermegor/filings-rfb"
keywords = ["filings-rfb", "python", "library"]
packages = [{ include = "filings_rfb", from = "src" }]
exclude = ["src/**/CLAUDE.md"]
package-mode = true
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
]

[tool.poetry.urls]
"Bug Reports" = "https://github.com/guilhermegor/filings-rfb/issues"
"Source" = "https://github.com/guilhermegor/filings-rfb"
"Documentation" = "https://guilhermegor.github.io/filings-rfb/"

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
beartype = ">=0.22"
pandas = ">=2.1.0"
numpy = ">=1.22"
openpyxl = ">=3.1.0"
defusedxml = ">=0.7"

[tool.poetry.group.dev.dependencies]
poethepoet = ">=0.35"
pre-commit = ">=4.1.0"
pretty-errors = ">=1.2.25"
commitizen = ">=4.4.1"
build = ">=1.2.2"
twine = ">=6.1.0"
ruff = ">=0.11.13,<0.12"
codespell = ">=2.4.1"
pydocstyle = ">=6.3.0"
pytest = ">=8.0.0"
pytest-cov = ">=6.0.0"
pytest-randomly = ">=3.15.0"
coverage = ">=7.6.0"
genbadge = {extras = ["coverage"], version = ">=1.1.0"}
mypy = ">=1.8.0"
sqlfluff = ">=3.0.0"
yamllint = ">=1.35.0"
shfmt-py = ">=3.7.0"
shellcheck-py = ">=0.10.0"
deptry = ">=0.20"
tomli = { version = ">=2.0.1", python = "<3.11" }

[tool.poetry.group.docs.dependencies]
mkdocs = ">=1.6.0"
mkdocs-material = ">=9.5.0"
pymdown-extensions = ">=10.0"
mike = ">=2.1.0"

[tool.deptry.per_rule_ignores]
DEP002 = ["openpyxl"]

[tool.poetry-dynamic-versioning]
# Published version is derived from the latest git tag matching `v$version` (e.g. v0.2.0). On
# an exact tag the build is clean (0.2.0); off-tag builds get a PEP 440 dev version. The CI
# release workflows pass POETRY_DYNAMIC_VERSIONING_BYPASS to build a specific version. Needs
# `python -m build` (a PEP 517 frontend), not `poetry build` (which ignores the backend).
enable = true
vcs = "git"
style = "pep440"

[build-system]
requires = ["poetry-core>=1.7.0", "poetry-dynamic-versioning>=1.4.0,<2.0.0"]
build-backend = "poetry_dynamic_versioning.backend"
