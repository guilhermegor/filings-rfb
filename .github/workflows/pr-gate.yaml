name: PR Quality Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      backfill:
        description: "Re-evaluate EVERY open PR (use after changing gate policy)"
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write
  checks: read
  statuses: read

concurrency:
  group: pr-gate-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  gate:
    if: github.event_name == 'pull_request'
    name: Classify and gate this PR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set Up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Run PR gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python bin/pr_gate.py

  backfill:
    if: github.event_name == 'workflow_dispatch' && inputs.backfill
    name: Re-evaluate every open PR (policy backfill)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set Up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Re-run the gate on all open PRs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          for n in $(gh pr list --state open --limit 100 --json number --jq '.[].number'); do
            echo "::group::PR #$n"
            PR_NUMBER="$n" python bin/pr_gate.py || echo "::warning::gate failed for PR #$n"
            echo "::endgroup::"
          done
