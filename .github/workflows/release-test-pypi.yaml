name: Release to Test PyPI

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.2.3, 1.2.3a1, 1.2.3b1, 1.2.3rc1)'
        required: true
        type: string

env:
  PACKAGE_NAME: "filings-rfb"
  OWNER: "guilhermegor"

jobs:
  run_tests:
    uses: ./.github/workflows/tests.yaml
    secrets: inherit

  details:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      new_version: ${{ steps.release.outputs.new_version }}
      suffix: ${{ steps.release.outputs.suffix }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Check Ref Type
        if: github.event_name != 'workflow_dispatch' && github.ref_type != 'tag'
        run: echo "This is not a tag or workflow_dispatch; exiting"; exit 1

      - name: Validate version
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)((a|b|rc)(0|[1-9][0-9]*)|\.post(0|[1-9][0-9]*)|\.dev(0|[1-9][0-9]*))?$ ]]; then
            echo "::error::Invalid version '$VERSION' — expected PEP 440 MAJOR.MINOR.PATCH with no leading zeroes, optionally followed by exactly one of a<N>/b<N>/rc<N>, .post<N> or .dev<N> (e.g. 1.2.3, 1.2.3rc1, 1.2.3.post1). Rejected: 1.2.3foo1, 1.2.3-rc.1, 01.2.3." >&2
            exit 1
          fi

      - name: Extract Tag and Details
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT_NAME" == "workflow_dispatch" ]; then
            NEW_VERSION="$INPUT_VERSION"
            SUFFIX=$(printf '%s' "$NEW_VERSION" | grep -oP '(?<=[0-9])(a|b|rc|\.post|\.dev)[0-9]+$' || echo "")
            TAG_NAME="$NEW_VERSION"
          else
            TAG_NAME=${GITHUB_REF#refs/tags/}
            CLEAN_TAG=$(echo "$TAG_NAME" | sed 's/-test$//')
            NEW_VERSION=$(echo "$CLEAN_TAG" | awk -F'-' '{print $1}')
            SUFFIX=$(printf '%s' "$CLEAN_TAG" | grep -oP '(?<=[0-9])(a|b|rc|\.post|\.dev)[0-9]+$' || echo "")
          fi
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "suffix=$SUFFIX" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: Debug Outputs
        if: ${{ env.RUNNER_DEBUG == '1' }}
        run: |
          echo "Version is ${{ steps.release.outputs.new_version }}"
          echo "Suffix is ${{ steps.release.outputs.suffix }}"
          echo "Tag name is ${{ steps.release.outputs.tag_name }}"

  check_test_pypi:
    needs: details
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Fetch Information from Test PyPI
        run: |
          response=$(curl -s https://test.pypi.org/pypi/${{ env.PACKAGE_NAME }}/json || echo "{}")
          latest_previous_version=$(echo $response | grep -oP '"releases":\{"\K[^"]+' | sort -rV | head -n 1)
          if [ -z "$latest_previous_version" ]; then
            echo "Package not found on Test PyPI."
            latest_previous_version="0.0.0"
          fi
          echo "Latest version on Test PyPI: $latest_previous_version"
          echo "latest_previous_version=$latest_previous_version" >> $GITHUB_ENV

      - name: Compare Versions - Exit When Not Greater
        env:
          NEW_VERSION: ${{ needs.details.outputs.new_version }}
        run: |
          LATEST_VERSION=$latest_previous_version
          if [ "$(printf '%s\n' "$LATEST_VERSION" "$NEW_VERSION" | sort -rV | head -n 1)" != "$NEW_VERSION" ] || [ "$NEW_VERSION" == "$LATEST_VERSION" ]; then
            echo "The new version $NEW_VERSION is not greater than the latest version $LATEST_VERSION on Test PyPI."
            exit 1
          else
            echo "The new version $NEW_VERSION is greater than the latest version $LATEST_VERSION on Test PyPI."
          fi

  setup_and_build:
    needs: [details, check_test_pypi, run_tests]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.12.8"]
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set Up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1.4.2
        with:
          virtualenvs-in-project: true
          virtualenvs-create: true
          version: 2.1.2

      - name: Load Cached Virtual Environment
        id: cached-venv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .venv
            poetry.lock
          key: venv-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}

      - name: Install Dependencies
        if: steps.cached-venv.outputs.cache-hit != 'true'
        run: |
          cp pyproject.toml pyproject.original.toml
          cat pyproject.original.toml | python -c '
          import sys, re
          content = sys.stdin.read()
          content = re.sub(r".*platform\s*=\s*\"win32\".*", "", content)
          content = re.sub(r"pywin32\s*=.*\n", "", content)
          print(content)
          ' > pyproject.toml

          if ! poetry check --lock; then
            echo "Lock file is outdated, regenerating..."
            rm -f poetry.lock
            poetry lock --no-cache
          fi

          without_groups=()
          if grep -q '\[tool.poetry.group.dev\]' pyproject.toml; then
            without_groups+=("dev")
          fi
          if grep -q '\[tool.poetry.group.docs\]' pyproject.toml; then
            without_groups+=("docs")
          fi
          if [ ${#without_groups[@]} -gt 0 ]; then
            echo "Excluding groups: ${without_groups[*]}"
            str_without="$(IFS=,; printf '%s' "${without_groups[*]}")"
            poetry install --no-interaction --no-root --without "$str_without"
          else
            echo "No groups to exclude, installing all dependencies"
            poetry install --no-interaction --no-root
          fi

          mv pyproject.original.toml pyproject.toml
          poetry env activate

      - name: Build Package
        env:
          POETRY_DYNAMIC_VERSIONING_BYPASS: ${{ needs.details.outputs.new_version }}
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Upload Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  test_pypi:
    name: test_pypi
    needs: setup_and_build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: release-test-pypi
    permissions:
      id-token: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish to Test PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
