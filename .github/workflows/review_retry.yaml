name: Review Retry

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: review-retry-${{ github.repository }}
  cancel-in-progress: false

jobs:

  retry:
    name: Re-ask a rate-limited reviewer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - run: pip install --quiet pyyaml

      - name: Re-request a review where the reviewer was rate limited
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_REVIEW_TRIGGER }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python bin/retry_rate_limited_review.py
