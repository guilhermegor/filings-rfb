name: Review Retry

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: review-retry-${{ github.repository }}
  cancel-in-progress: false

jobs:

  retry:
    name: Re-ask a rate-limited reviewer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - run: pip install --quiet pyyaml

      - name: Re-request a review where the reviewer was rate limited
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_REVIEW_TRIGGER }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python bin/retry_rate_limited_review.py
